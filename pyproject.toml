[project]
name = "playharness"
version = "0.2.0"
description = "A harness that uses Claude models to learn and play boardgames on BoardGameArena"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.117",
    "pydantic>=2",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
playharness = "playharness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["playharness", "playharness.bga"]

[tool.pytest.ini_options]
testpaths = ["tests"]
